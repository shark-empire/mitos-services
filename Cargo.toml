[package]
name = "mitos-services"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <babor3331@gmail.com>"]
description = "MITOS's service manager - runs as a supervised child of mitos-init"
license = "MIT OR Apache-2.0"

[dependencies]
# Notably lighter than mitos-init's own dependency list: none of the
# moved code (supervisor, cgroups, notify, rollback, users, config, IPC)
# turned out to need libc directly - it's all nix wrappers or plain std.
# libc is still needed here for one thing: PR_SET_CHILD_SUBREAPER, which
# nix doesn't wrap (prctl's operation space is too broad for a single
# high-level wrapper to cover).
nix = { version = "0.27", features = ["process", "signal", "hostname"] }
libc = "0.2"

# Same reasoning as mitos-init's profile: small, fast-loading binary,
# no unwind machinery for a process whose error paths already return
# Result rather than panic.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
